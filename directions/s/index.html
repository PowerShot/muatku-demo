<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f3ef">
<title>Muatku · Ritase Hilang — ke mana ritase minggu ini?</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#007879;--brand-400:#2aa69e;--brand-500:#0a8d89;--brand-600:#006d6e;--brand-700:#006264;--brand-800:#004f51;--brand-900:#003b3d;
  --brand-50:#eaf9f7;--tint:#d6f2ef;
  --surface:#fff;--canvas:#f6f3ef;--line:#e8e3dd;--fillc:#f3efea;--ink:#211b16;--ink-2:#57504a;--ink-3:#6b655f;
  --ok:#1f7a3d;--ok-bg:#e5f4ea;--ok-fill:#2f8f4e;--warn:#8f520c;--warn-icon:#dd9314;--warn-bg:#fbf0db;
  --empty:#85461b;--empty-icon:#c0763e;--empty-bg:#f7ebdf;
  --shadow-card:0 1px 2px rgb(33 27 22/.05),0 4px 12px -6px rgb(33 27 22/.1);
  --ease:cubic-bezier(.22,1,.36,1);--hdr:56px;
  --hatch:repeating-linear-gradient(-45deg,rgb(0 120 121/.34) 0 4px,rgb(0 120 121/.14) 4px 8px);
  --hatch-g:repeating-linear-gradient(-45deg,rgb(87 80 74/.32) 0 4px,rgb(87 80 74/.12) 4px 8px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--canvas);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
b,.num{font-variant-numeric:tabular-nums}
.app{max-width:430px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}
.neg{color:var(--warn)} .pos{color:var(--ok)}

/* header */
.hdr{position:sticky;top:0;z-index:30;height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 16px;padding-top:env(safe-area-inset-top);
  background:rgb(246 243 239/.92);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.logo{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,#007273,#00605f 55%,#00474a);box-shadow:0 6px 14px -8px rgb(0 79 81/.8)}
.brandtxt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brandtxt b{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt b em{font-style:normal;color:var(--brand-700)}
.brandtxt span{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 9px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-card);font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#22a352;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgb(34 163 82/.5)}70%{box-shadow:0 0 0 7px rgb(34 163 82/0)}100%{box-shadow:0 0 0 0 rgb(34 163 82/0)}}
.lang{flex:none;margin-left:-4px;display:inline-flex;align-items:center;height:28px;padding:2px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-card);font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-3)}
.lang span{min-width:22px;height:24px;padding:0 4px;display:grid;place-items:center;border-radius:999px;transition:background .2s,color .2s}
.lang span.on{background:var(--brand);color:#fff}

/* cards */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-card);margin:0 12px 12px;padding:16px;animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.card-h h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--ink-3);font-size:12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.neu{background:var(--fillc);color:var(--ink-2)}

/* hero */
.hero{padding:16px 16px 14px;margin-top:4px}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.eyebrow .muted{font-size:11.5px}
.hero h1{font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.hero p.sub{margin-top:7px;font-size:14px;color:var(--ink-2);font-weight:500;text-wrap:pretty}
.hero p.sub b{color:var(--ink);font-weight:800}
.week{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.wd .dots{height:34px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;gap:3px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.dot.done{background:var(--brand)}
.dot.lost{border:2px dashed var(--warn-icon);background:var(--warn-bg)}
.dot.prog{border:2.5px solid var(--brand);background:#fff;position:relative}
.dot.prog::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--brand);opacity:.35;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.85}}
.dot.fut{border:1.5px dashed #b9b2aa}
.dot.half{opacity:.5}
.wd .dl{font-size:11px;font-weight:700;color:var(--ink-3);line-height:1}
.wd.now .dl{color:var(--brand-800);font-weight:800}
.wd .dn{font-size:10.5px;font-weight:800;color:var(--ink-2);line-height:1}
.wd .dn.neg{color:var(--warn)}
.wlg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:11px;font-weight:600;color:var(--ink-3)}
.wlg span{display:inline-flex;align-items:center;gap:5px}
.wlg .dot{width:10px;height:10px}

/* waterfall */
.rule{font-size:12px;color:var(--ink-3);font-weight:600;margin:2px 0 6px}
.wf{position:relative;padding-top:40px}
.wf-ax{position:absolute;left:0;right:0;top:18px;height:16px}
.wf-ax span{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--ink-3)}
.wf-ax span:first-child{transform:none} .wf-ax span:last-child{transform:translateX(-100%)}
.wf-grid{position:absolute;left:0;right:0;top:36px;bottom:0;pointer-events:none}
.wf-grid i{position:absolute;top:0;bottom:0;border-left:1px solid rgb(33 27 22/.05)}
.wf-band{position:absolute;top:36px;bottom:0;border-radius:6px;background:rgb(0 120 121/.07);border-left:1.5px dashed rgb(0 120 121/.5);border-right:1.5px dashed rgb(0 120 121/.5);pointer-events:none}
.wf-band span{position:absolute;top:-37px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;color:var(--brand-700);white-space:nowrap;background:var(--surface);padding:0 4px;border-radius:6px}
.wf-row{position:relative;z-index:1;display:block;width:100%;padding:8px 0 6px;border-top:1px solid var(--line)}
.wf-row:first-of-type{border-top:0}
button.wf-row{border-radius:12px;transition:background .2s}
button.wf-row:active{background:rgb(33 27 22/.03)}
.wf-row[aria-expanded=true]{background:linear-gradient(rgb(0 120 121/.05),rgb(0 120 121/0))}
.wf-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.wf-l{font-size:13.5px;font-weight:700;min-width:0}
.wf-v{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.wf-row.tot .wf-l{font-weight:800}
.wf-row.tot .wf-v{font-size:19px}
.wf-track{display:block;position:relative;height:14px;margin:5px 0 4px}
.wf-track .lk{position:absolute;top:-30px;height:30px;border-left:1px dotted var(--ink-3);opacity:.55}
.wf-bar{position:absolute;top:0;bottom:0;border-radius:5px;min-width:3px;transform-origin:left center;animation:grow .7s var(--ease) both;animation-delay:calc(var(--j,0)*60ms + 200ms)}
@keyframes grow{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.wf-bar.neg{background:var(--warn-icon)} .wf-bar.pos{background:var(--ok-fill)} .wf-bar.zero{background:#b9b2aa}
.wf-bar.typ{background:var(--hatch);box-shadow:inset 0 0 0 1.5px rgb(0 109 110/.45)}
.wf-bar.real{background:linear-gradient(90deg,var(--brand-500),var(--brand))}
.wf-bar.prog{background:var(--hatch-g);box-shadow:inset 0 0 0 1.5px rgb(87 80 74/.4)}
.wf-sub{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);font-weight:600}
.wf-sub>span:first-child{min-width:0}
.chev{flex:none;width:22px;height:22px;border-radius:8px;display:grid;place-items:center;background:var(--fillc);color:var(--ink-2);transition:transform .25s var(--ease)}
.wf-row[aria-expanded=true] .chev{transform:rotate(180deg);background:var(--brand);color:#fff}
.wf-dr{position:relative;z-index:1;background:var(--fillc);border-radius:14px;padding:11px 12px;margin:2px 0 10px;animation:up .35s var(--ease) both}
.wf-dr[hidden]{display:none}
.dr-note{font-size:12.5px;color:var(--ink-2);font-weight:500;text-wrap:pretty}
.dr-note b{color:var(--ink);font-weight:800}
.dr-list{list-style:none;margin-top:8px;display:flex;flex-direction:column}
.dr-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid rgb(33 27 22/.08)}
.dr-list li:first-child{border-top:0}
.dl-l{min-width:0}
.dl-l b{display:block;font-size:12.5px;font-weight:800}
.dl-l span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;overflow-wrap:anywhere}
.dl-r{text-align:right;white-space:nowrap}
.dl-r b{display:block;font-size:13px;font-weight:800}
.dl-r span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.dl-r .tag{display:inline-block;margin-top:2px;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.dl-r .tag.ok{background:var(--ok-bg);color:var(--ok)} .dl-r .tag.neu{background:#fff;color:var(--ink-2)}
li.live-row .dl-l b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22a352;margin-right:6px;vertical-align:1px}
.dr-act{margin-top:8px;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:700;color:var(--brand-800);background:#fff;border-radius:11px;padding:8px 10px}
.dr-act svg{flex:none;margin-top:1px}
.wf-lg{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:10px;font-size:11px;font-weight:600;color:var(--ink-3)}
.wf-lg span{display:inline-flex;align-items:center;gap:5px}
.wf-lg i{width:14px;height:8px;border-radius:3px;display:inline-block}
.hint{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--ink-3);font-weight:600}

/* forecast */
.fc-top{display:flex;align-items:center;gap:14px;margin:8px 0 12px}
.fc-big{flex:none;width:68px;height:68px;border-radius:18px;background:var(--brand-50);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--brand-800)}
.fc-big b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.03em}
.fc-big span{font-size:10.5px;font-weight:800;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.fc-txt{font-size:13px;color:var(--ink-2);font-weight:500}
.fc-txt b{color:var(--ink);font-weight:800}
.pb{display:grid;grid-template-columns:auto 1fr 46px;align-items:center;gap:6px 10px}
.pb .pl{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pb .pl em{font-style:normal;color:var(--brand-700);font-weight:800}
.pb .pv{font-size:14px;font-weight:800;text-align:right}
.ptrack{position:relative;height:12px;border-radius:999px;background:rgb(33 27 22/.07)}
.pfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--brand-500),var(--brand));transition:width .45s var(--ease);min-width:2px}
.pghost{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px solid var(--ink-2);opacity:0;transition:left .45s var(--ease),opacity .25s}
.pghost.on{opacity:.55}
.levers{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.levers h3{font-size:13px;font-weight:800;margin-bottom:8px}
.lev{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-radius:14px;background:var(--fillc);margin-bottom:6px;transition:background .2s,box-shadow .2s}
.lev[aria-checked=true]{background:var(--brand-50);box-shadow:inset 0 0 0 1.5px var(--brand-400)}
.lev .lt{flex:1;min-width:0;font-size:13px;font-weight:700}
.lev .lt span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:1px}
.sw{flex:none;width:38px;height:22px;border-radius:999px;background:#cfc8c0;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(33 27 22/.3);transition:transform .25s var(--ease)}
.lev[aria-checked=true] .sw{background:var(--brand)} .lev[aria-checked=true] .sw::after{transform:translateX(16px)}
.flip{margin-top:6px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--warn-bg);border-radius:12px;padding:9px 11px;text-wrap:pretty}
.flip b{color:var(--ink);font-weight:800}
.flip.good{background:var(--ok-bg)}
.base{margin-top:10px;font-size:11.5px;color:var(--ink-3);font-weight:500;line-height:1.45}

/* in app */
.inapp{display:flex;flex-direction:column;gap:9px}
.inapp h2{font-size:13px;font-weight:800;color:var(--brand-800);letter-spacing:.02em;text-transform:uppercase}
.ia{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);font-weight:500}
.ia .iai{flex:none;width:28px;height:28px;border-radius:9px;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center}
.ia b{color:var(--ink);font-weight:800}
.foot{margin:6px 20px 0;font-size:11px;color:var(--ink-3);font-weight:500;line-height:1.45}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h3V9H4zM10.5 18h3V5h-3z"/><path d="M17 18h3v-6h-3z" stroke-dasharray="2.2 2"/></svg></div>
    <div class="brandtxt"><b>Muatku · <em id="brand-c">Ritase Hilang</em></b><span>Dump Truck 01 · BM 8921 KU</span></div>
    <div class="live"><i></i><span id="live-t">15:20</span></div>
    <button class="lang" id="b-lang" type="button" aria-label="Ganti bahasa ke English"><span data-l="id" class="on">ID</span><span data-l="en">EN</span></button>
  </header>

  <section class="card hero" style="--i:0" aria-live="polite">
    <div class="eyebrow"><span class="pill warn" id="h-pill"><i></i>—</span><span class="muted" id="h-ref">—</span></div>
    <h1 id="h-title">—</h1>
    <p class="sub" id="h-sub">—</p>
    <div class="week" id="week"></div>
  </section>

  <section class="card" style="--i:1" id="bridge">
    <div class="card-h"><h2 id="br-h">—</h2><span class="muted" id="br-t">—</span></div>
    <p class="rule" id="br-rule">—</p>
    <div class="wf" id="wf"></div>
    <div class="wf-lg" id="wf-lg"></div>
    <div class="hint" id="br-hint"></div>
  </section>

  <section class="card" style="--i:2" id="fc">
    <div class="card-h"><h2 id="fc-h">—</h2><span class="pill neu" id="fc-pill">—</span></div>
    <div class="fc-top"><div class="fc-big"><b id="fc-med">—</b><span id="fc-unit">—</span></div><div class="fc-txt" id="fc-txt">—</div></div>
    <div class="pb" id="pb"></div>
    <div class="levers">
      <h3 id="lv-h">—</h3>
      <button class="lev" role="switch" aria-checked="false" data-lv="normalLoad" type="button"><span class="lt" id="lv1">—</span><span class="sw" aria-hidden="true"></span></button>
      <button class="lev" role="switch" aria-checked="false" data-lv="sunday" type="button"><span class="lt" id="lv2">—</span><span class="sw" aria-hidden="true"></span></button>
      <p class="flip" id="flip" aria-live="polite">—</p>
    </div>
    <p class="base" id="fc-base">—</p>
  </section>

  <section class="card inapp" style="--i:3">
    <h2 id="ia-h">Di aplikasi</h2>
    <div class="ia"><span class="iai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><div id="ia1">—</div></div>
    <div class="ia"><span class="iai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span><div id="ia2">—</div></div>
  </section>
  <p class="foot" id="foot">—</p>
</div>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
