<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f3ef">
<title>Muatku · Cek Solar — solar dicatat vs perkiraan GPS</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#007879;--brand-400:#2aa69e;--brand-500:#0a8d89;--brand-600:#006d6e;--brand-700:#006264;--brand-800:#004f51;--brand-900:#003b3d;
  --brand-50:#eaf9f7;--tint:#d6f2ef;--tint-2:#b9e8e2;
  --surface:#fff;--canvas:#f6f3ef;--line:#e8e3dd;--fillc:#f3efea;--ink:#211b16;--ink-2:#57504a;--ink-3:#6b655f;
  --ok:#1f7a3d;--ok-bg:#e5f4ea;--ok-fill:#2f8f4e;--warn:#8f520c;--warn-icon:#dd9314;--warn-bg:#fbf0db;
  --empty:#85461b;--empty-icon:#c0763e;--empty-bg:#f7ebdf;
  --shadow-card:0 1px 2px rgb(33 27 22/.05),0 4px 12px -6px rgb(33 27 22/.1);
  --shadow-float:0 1px 2px rgb(33 27 22/.08),0 6px 18px -4px rgb(33 27 22/.18);
  --ease:cubic-bezier(.22,1,.36,1);
  --hdr:56px;
  --c-load:var(--brand);--c-empty:var(--empty-icon);--c-idle:#8a837c;--c-speed:var(--warn-icon);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--canvas);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
b,.num{font-variant-numeric:tabular-nums}
.app{max-width:430px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:10px}

/* header */
.hdr{position:sticky;top:0;z-index:30;height:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 16px;
  padding-top:env(safe-area-inset-top);background:rgb(246 243 239/.92);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.logo{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,#007273,#00605f 55%,#00474a);box-shadow:0 6px 14px -8px rgb(0 79 81/.8)}
.brandtxt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brandtxt b{font-size:15.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt b em{font-style:normal;color:var(--brand-700)}
.brandtxt span{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.per{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow-card);font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.lang{flex:none;margin-left:-4px;display:inline-flex;align-items:center;height:28px;padding:2px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow-card);
  font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-3)}
.lang span{min-width:22px;height:24px;padding:0 4px;display:grid;place-items:center;border-radius:999px;transition:background .2s,color .2s}
.lang span.on{background:var(--brand);color:#fff}

/* cards */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-card);margin:0 12px 12px;padding:16px;animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.card-h h2{font-size:15px;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--ink-3);font-size:12px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.neu{background:var(--fillc);color:var(--ink-2)}
.pill.todo{background:var(--brand-50);color:var(--brand-700)} .pill.low{background:var(--empty-bg);color:var(--empty)}

/* conclusion */
.hero{padding:16px 16px 14px;margin-top:4px}
.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.eyebrow .muted{font-size:11.5px}
.hero h1{font-size:21px;line-height:1.2;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.hero h1 .neg{color:var(--warn)} .hero h1 .pos{color:var(--ok)}
.hero h1 a{font-weight:800;color:var(--warn);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:rgb(221 147 20/.45)}
.hero p.sub{margin-top:6px;font-size:13.5px;color:var(--ink-2);font-weight:500;text-wrap:pretty}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.kpi{background:var(--fillc);border-radius:14px;padding:9px 10px 8px;min-width:0}
.kpi span{display:block;font-size:11px;font-weight:700;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.kpi small{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.gap{background:var(--ok-bg)} .kpi.gap b{color:var(--ok)}
.kpi.gap.w{background:var(--warn-bg)} .kpi.gap.w b{color:var(--warn)}
.rbar{margin-top:12px}
.rbar .cap{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.rbar svg{display:block;width:100%;height:auto;margin-top:2px;overflow:visible}
svg text{font-family:"Plus Jakarta Sans",sans-serif;font-variant-numeric:tabular-nums}
.todo-line{margin-top:10px;width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;border:1.5px dashed var(--tint-2);background:var(--brand-50);text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.todo-line b{color:var(--brand-800);font-weight:800}
.todo-line .go{margin-left:auto;flex:none;font-weight:800;color:var(--brand-700);white-space:nowrap}

/* chart */
.lede{font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;font-weight:700;color:var(--ink-2);margin:0 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{display:inline-block;flex:none}
.legend .hint{color:var(--brand-700);font-weight:800}
.lg-cur{width:9px;height:9px;border-radius:50%;background:var(--brand)}
.lg-hi{width:10px;height:10px;border-radius:50%;background:var(--warn-icon)}
.lg-prev{width:7px;height:7px;border-radius:50%;background:#bdb5ac}
.lg-todo{width:9px;height:9px;border-radius:50%;border:1.6px dashed var(--brand-600)}
.lg-band{width:18px;height:9px;border-radius:3px;background:rgb(0 120 121/.13);border-top:1.5px solid var(--brand);border-bottom:1px dashed var(--brand-400)}
#chart{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#chart .pt{transform-box:fill-box;transform-origin:center;animation:pop .5s var(--ease) both;animation-delay:calc(var(--d,0)*14ms)}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.principle{display:flex;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--fillc);font-size:12.5px;color:var(--ink-2);font-weight:500;line-height:1.42}
.principle .ic{flex:none;width:26px;height:26px;border-radius:8px;background:#fff;color:var(--brand-700);display:grid;place-items:center;margin-top:1px}
.principle b{color:var(--ink);font-weight:800}
.principle button{font-weight:800;color:var(--brand-700);text-decoration:underline;text-underline-offset:2px}

/* détail */
.dt{scroll-margin-top:calc(var(--hdr) + 8px)}
.dt[hidden]{display:none}
.dt.flash{animation:flash .7s var(--ease)}
@keyframes flash{from{box-shadow:0 0 0 3px rgb(0 120 121/.35),var(--shadow-card)}to{box-shadow:var(--shadow-card)}}
.dt-h{display:flex;align-items:flex-start;gap:10px}
.dt-t{min-width:0;flex:1}
.dt-t b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.dt-t span{display:block;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:2px}
.xbtn{flex:none;width:32px;height:32px;border-radius:10px;background:var(--fillc);display:grid;place-items:center;color:var(--ink-2)}
.dt .xbtn svg{width:14px;height:14px}
.dt-s{display:flex;align-items:center;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
.dt h3{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase;margin:14px 0 6px}
.dt svg{display:block;width:100%;height:auto;overflow:visible}
.dec{display:grid;grid-template-columns:1fr auto auto;gap:5px 10px;font-size:12.5px;margin-top:6px;align-items:baseline}
.dec .l{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--ink);min-width:0}
.dec .l i{flex:none;width:10px;height:10px;border-radius:3px}
.dec .f{color:var(--ink-3);font-weight:600;text-align:right;white-space:nowrap}
.dec .v{font-weight:800;text-align:right;white-space:nowrap;min-width:46px}
.dec .sep{grid-column:1/-1;height:1px;background:var(--line);margin:2px 0}
.dec .tot{font-weight:800}
.dec .usual .l{color:var(--brand-800)} .dec .usual .v{color:var(--brand-800)}
.dec .usual{display:contents}
.dec .decl .l,.dec .decl .v{font-size:13.5px}
.dec .decl{display:contents}
.dec .decl.w .v{color:var(--warn)}
.wf{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.wr{display:grid;grid-template-columns:128px 1fr 50px;gap:8px;align-items:center;font-size:12.5px}
.wr .wl b{display:block;font-weight:800;line-height:1.15}
.wr .wl small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;line-height:1.2;margin-top:1px}
.wr .tr{position:relative;height:14px;border-radius:5px;background:var(--fillc)}
.wr .sg{position:absolute;top:0;bottom:0;border-radius:4px;min-width:2px}
.wr .wv{text-align:right;font-weight:800;white-space:nowrap}
.wr.base .sg{background:#cfe9e5}
.wr.c .sg{background:var(--ink-3)} .wr.c.neg .sg{background:#b9b1a8}
.wr.c.zero .wv{color:var(--ink-3)}
.wr.un .sg{background:var(--warn-icon)} .wr.un .wv{color:var(--warn)}
.wr.un.okk .sg{background:var(--brand-400)} .wr.un.okk .wv{color:var(--ink)}
.wr.un .tol{position:absolute;top:-3px;bottom:-3px;border:1.5px dashed var(--brand-600);border-radius:5px;background:rgb(0 120 121/.08)}
.wr.tot{padding-top:7px;border-top:1px solid var(--line)} .wr.tot .sg{background:var(--ink)}
.verdict{margin-top:12px;padding:11px 12px;border-radius:14px;font-size:13px;line-height:1.42;color:var(--ink-2);font-weight:500;display:flex;gap:9px}
.verdict .vd{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ok-fill)}
.verdict b{color:var(--ink);font-weight:800}
.verdict.ok{background:var(--ok-bg)} .verdict.warn{background:var(--warn-bg)} .verdict.warn .vd{background:var(--warn-icon)}
.verdict.low{background:var(--empty-bg)} .verdict.low .vd{background:var(--empty-icon)}
.verdict.todo{background:var(--brand-50)} .verdict.todo .vd{background:var(--brand)}
.verdict.done{background:var(--fillc)} .verdict.done .vd{background:var(--ink-3)}
.verdict .act{display:block;margin-top:5px;font-size:12.5px}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 4px 10px -5px rgb(0 79 81/.9)}
.btn.sec{background:var(--fillc);color:var(--ink-2)}
.est{font-size:11px;font-weight:700;color:var(--ink-3)}

/* liste */
.seg{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--fillc);margin-bottom:8px}
.seg button{flex:1;height:30px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:var(--shadow-card)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-radius:12px;text-align:left;width:100%}
.row+.row{border-top:1px solid var(--line)}
.row.on{background:var(--brand-50)}
.row .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
.row .dot.high{background:var(--warn-icon)} .row .dot.todo{background:#fff;border:1.6px dashed var(--brand-600)} .row .dot.low{background:var(--empty-icon)} .row .dot.done{background:var(--ink-3)}
.row .rt{min-width:0}
.row .rt b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rv{text-align:right}
.row .rv b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap}
.row .rv span{display:inline-block;margin-top:2px;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--fillc);color:var(--ink-2);white-space:nowrap}
.row .rv span.high{background:var(--warn-bg);color:var(--warn)} .row .rv span.todo{background:var(--brand-50);color:var(--brand-700)} .row .rv span.low{background:var(--empty-bg);color:var(--empty)}
.more{margin-top:6px;width:100%;height:36px;border-radius:12px;background:var(--fillc);font-size:12.5px;font-weight:800;color:var(--brand-700)}

/* asumsi */
.asm-r{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0}
.asm-r+.asm-r{border-top:1px solid var(--line)}
.asm-r .al b{display:block;font-size:13px;font-weight:800}
.asm-r .al span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.stp{display:inline-flex;align-items:center;gap:2px;background:var(--fillc);border-radius:12px;padding:3px}
.stp button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--brand-800);background:#fff;box-shadow:0 1px 2px rgb(33 27 22/.08)}
.stp button:active{transform:scale(.94)}
.stp output{min-width:62px;text-align:center;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums}
.stp output.chg{color:var(--brand-700)}
.reset{font-size:12.5px;font-weight:800;color:var(--brand-700)}
.reset[disabled]{color:var(--ink-3);opacity:.6;cursor:default}
.asm-msg{margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--brand-50);font-size:12.5px;color:var(--ink-2);font-weight:500;line-height:1.42}
.asm-msg b{color:var(--brand-900);font-weight:800}

/* di aplikasi */
.inapp{display:flex;flex-direction:column;gap:8px}
.inapp h2{font-size:13px;font-weight:800;color:var(--brand-800);letter-spacing:.02em;text-transform:uppercase}
.ia{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);font-weight:500}
.ia .iai{flex:none;width:28px;height:28px;border-radius:9px;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center}
.ia b{color:var(--ink);font-weight:800}
.foot{margin:6px 20px 0;font-size:11px;color:var(--ink-3);font-weight:500;line-height:1.45}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <div class="logo" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V7l6 5 6-5v10"/><circle cx="19" cy="15" r="2.2" stroke-dasharray="2.4 2"/></svg></div>
    <div class="brandtxt"><b>Muatku · <em>Cek Solar</em></b><span data-i18n="brandSub">Dump Truck 01 · BM 8921 KU</span></div>
    <div class="per" id="per">30 hari</div>
    <button class="lang" id="b-lang" type="button" aria-label="Ganti bahasa ke English"><span data-l="id" class="on">ID</span><span data-l="en">EN</span></button>
  </header>

  <section class="card hero" style="--i:0" aria-live="polite">
    <div class="eyebrow"><span class="pill ok" id="h-pill"><i></i>Wajar</span><span class="muted" id="h-meta"></span></div>
    <h1 id="h-title"></h1>
    <p class="sub" id="h-sub"></p>
    <div class="kpis" id="kpis"></div>
    <div class="rbar"><div class="cap"><span data-i18n="rbarCap">Dicatat ÷ perkiraan GPS</span><span id="rb-n"></span></div><svg id="rbar" viewBox="0 0 334 62" role="img"></svg></div>
    <button class="todo-line" id="h-todo" type="button"></button>
  </section>

  <section class="card" style="--i:1" id="sc">
    <div class="card-h"><h2 data-i18n="scH">Perkiraan vs dicatat</h2><span class="muted" data-i18n="scTap">1 titik = 1 perjalanan</span></div>
    <div class="legend" id="legend"></div>
    <svg id="chart" viewBox="0 0 334 300" role="img"></svg>
    <div class="principle"><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19 19 5"/><path d="M4 13l9-8"/><path d="M10 19l9-8"/></svg></span><div id="principle"></div></div>
  </section>

  <section class="card dt" style="--i:0" id="dt" hidden></section>

  <section class="card" style="--i:2" id="list">
    <div class="card-h"><h2 data-i18n="listH">Perjalanan 30 hari</h2><span class="muted" id="list-n"></span></div>
    <div class="seg" id="lseg" role="group"></div>
    <div class="rows" id="rows"></div>
  </section>

  <section class="card" style="--i:3" id="asm">
    <div class="card-h"><h2 data-i18n="asmH">Asumsi</h2><button class="reset" id="b-reset" type="button" data-i18n="reset">Reset</button></div>
    <p class="lede" data-i18n="asmLede">Perkiraan dari GPS saja (tanpa sensor BBM). Ubah angka untuk menguji.</p>
    <div id="asm-rows"></div>
    <div class="asm-msg" id="asm-msg"></div>
  </section>

  <section class="card inapp" style="--i:4">
    <h2 data-i18n="iaH">Di aplikasi</h2>
    <div class="ia"><span class="iai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg></span><div id="ia1"></div></div>
    <div class="ia"><span class="iai"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><div id="ia2"></div></div>
  </section>
  <p class="foot" data-i18n="foot"></p>
</div>
<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
